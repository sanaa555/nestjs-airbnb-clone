$kind: http-request
url: "{{URL}}/auth/register"
method: POST
body:
  type: json
  content: "{\r

    \r

    \    \"name\":\"sonson\",\r

    \    \"email\":\"sonson@gmail.com\",\r

    \    \"phoneNumber\":\"01239944967\",\r

    \    \"password\":\"sonson@123\"\r

